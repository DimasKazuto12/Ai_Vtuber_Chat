<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#a8c0ff" />
    <title>Mira · AI VTuber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Outfit:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  </head>
  <body>
    <div class="bg">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>
    <canvas id="sparkles"></canvas>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <i data-lucide="snowflake" class="brand-star"></i>
          <span class="brand-name">Mira</span>
          <span class="brand-tag">AI VTuber</span>
        </div>
        <div class="live"><span class="live-dot"></span>ONLINE</div>
      </header>

      <main class="layout">
        <section class="stage" id="stage" data-emotion="neutral">
          <div class="scene">
            <span class="cloud c1"></span>
            <span class="cloud c2"></span>
            <span class="cloud c3"></span>
          </div>

          <i data-lucide="snowflake" class="ornament o1"></i>
          <i data-lucide="sparkles" class="ornament o2"></i>
          <i data-lucide="paw-print" class="ornament o3"></i>
          <i data-lucide="snowflake" class="ornament o4"></i>
          <i data-lucide="sparkles" class="ornament o5"></i>

          <div class="aura">
            <span class="glow"></span>
            <span class="ring ring-1"></span>
            <span class="ring ring-2"></span>
            <span class="ring ring-3"></span>
          </div>

          <canvas id="avatar" title="Klik aku!"></canvas>
          <div class="emotes" id="emotes"></div>

          <div class="dialog">
            <div class="tab">
              <span class="tab-name">Mira</span>
              <span class="mood" id="mood"></span>
              <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="dialog-box" id="subtitle"></div>
          </div>
        </section>

        <section class="chat glass">
          <div class="chat-head">
            <div class="chat-badge"><i data-lucide="paw-print"></i></div>
            <div class="chat-title">
              <h2>Ngobrol sama Mira</h2>
              <p>Ketik atau bicara, Mira menjawab dengan suara</p>
            </div>
            <label class="voice-pick" title="Sumber suara">
              <i data-lucide="volume-2"></i>
              <select id="voice" aria-label="Sumber suara"></select>
            </label>
          </div>

          <div class="messages" id="messages"></div>

          <div class="chips" id="chips">
            <button type="button">Halo Mira!</button>
            <button type="button">Ceritakan hal lucu dong</button>
            <button type="button">Aku lagi sedih nih</button>
            <button type="button">Kamu cantik banget!</button>
          </div>

          <div class="composer">
            <input id="input" type="text" placeholder="Ketik pesan..." autocomplete="off" />
            <button id="mic" type="button" aria-label="Bicara" title="Bicara"><i data-lucide="mic"></i></button>
            <button id="send" type="button" aria-label="Kirim"><i data-lucide="send"></i></button>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
